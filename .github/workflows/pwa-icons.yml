name: Generate Caloyaa PWA icons
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write raster icons
        run: |
          printf '%s' '' | base64 -d > icon-192.png
          printf '%s' '' | base64 -d > icon-512.png
          file icon-192.png icon-512.png
      - name: Commit icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icon-192.png icon-512.png
          git diff --cached --quiet || git commit -m 'Add Caloyaa PWA raster icons'
          git push
