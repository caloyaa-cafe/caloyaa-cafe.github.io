name: Caloyaa food carousel refresh
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add four verified illustrations and carousel
        env:
          HERO_HTML_B64: 
          HERO_STYLE_B64: 
        run: |
          python3 - <<'PYCODE'
          import base64, re, urllib.request
          from pathlib import Path
          html = Path('index.html').read_text()
          start = html.index('<section class="slider"')
          end = html.index('</section>', start) + len('</section>')
          old_hero = html[start:end]
          old_images = re.findall(r'src="data:image/jpeg;base64,([^"]+)', old_hero)
          if len(old_images) != 2:
              raise RuntimeError('Expected two existing hero images; aborting safe patch')
          for i, data in enumerate(old_images, 1):
              Path(f'hero-{i}.jpg').write_bytes(base64.b64decode(data))
          # Additional paneer wrap and Veg Maggi images are licensed under CC BY-SA 4.0 by Shafana jasmine and Gannu03 respectively.
          # The additions load from Commons, rather than using the owner's own menu as if it were a product photo.
          for i, url in {
              3: 'https://thumb.wikimedia.org/wikipedia/commons/thumb/7/75/Paneer_kathi_roll_homemade.jpg/1280px-Paneer_kathi_roll_homemade.jpg',
              4: 'https://thumb.wikimedia.org/wikipedia/commons/thumb/0/02/Veg_Maggi_2.jpg/1280px-Veg_Maggi_2.jpg',
          }.items():
              request = urllib.request.Request(url, headers={'User-Agent': 'CaloyaaCafeSite/1.0'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = response.read()
              if not data.startswith(bytes.fromhex('ffd8ff')):
                  raise RuntimeError(f'Not a JPEG: hero-{i}')
              Path(f'hero-{i}.jpg').write_bytes(data)
          new_hero = base64.b64decode(__import__('os').environ['HERO_HTML_B64']).decode()
          new_style = base64.b64decode(__import__('os').environ['HERO_STYLE_B64']).decode()
          html = html[:start] + new_hero + html[end:]
          if 'id="caloyaa-visual-upgrade"' not in html:
              html = html.replace('</head>', new_style + '</head>', 1)
          credit = '<small class="photo-credits" style="display:block;text-align:center;padding:8px;background:#291d1b;color:#f6e1d2;font-size:10px">Illustrative photos: paneer wrap by Shafana jasmine and Veg Maggi by Gannu03, CC BY-SA 4.0 · Wikimedia Commons.</small>'
          if 'class="photo-credits"' not in html:
              html = html.replace('</body>', credit + '</body>', 1)
          Path('index.html').write_text(html)
          PYCODE
      - name: Commit carousel
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html hero-1.jpg hero-2.jpg hero-3.jpg hero-4.jpg
          git diff --cached --quiet || git commit -m 'Add four-slide Caloyaa food carousel'
          git push
