name: Caloyaa stock - owner toggle
on:
  workflow_dispatch:
    inputs:
      item:
        description: 'Choose the menu item'
        required: true
        type: choice
        options:
          - "Aloo Tikki Burger"
          - "Aloo Tikki Burger with Cheese"
          - "Paneer Corn Sandwich"
          - "Paneer Capsicum Sandwich"
          - "Cheese Grill Sandwich"
          - "Masala Maggi"
          - "Veg Maggi"
          - "Cheese Maggi"
          - "Peri Peri Maggi"
          - "Pasta"
          - "Garlic Pasta"
          - "Aloo Wrap"
          - "Peri Peri Paneer Wrap"
          - "Cheese Garlic Bread"
          - "Salted Fries"
          - "Peri Peri Fries"
          - "Veg Momos (₹50 portion)"
          - "Veg Momos (₹90 portion)"
          - "Paneer Momos (₹60 portion)"
          - "Paneer Momos (₹100 portion)"
          - "Brownie with Choco Syrup"
          - "Chocolate Ice Cream"
          - "Strawberry Ice Cream"
          - "Butterscotch Ice Cream"
          - "Lay's Chips (Rs 15 pack)"
          - "Lay's Chips (Rs 20 pack)"
          - "Kit Kat"
          - "Dairy Milk"
          - "5 Star"
          - "Mojito Mocktail"
          - "Blueberry Mocktail"
          - "Green Apple Mocktail"
          - "Bubble Gum Mocktail"
          - "Watermelon Mocktail"
          - "Kala Khatta Mocktail"
          - "Cranberry Mocktail"
          - "Coke"
          - "Red Bull"
          - "Monster"
          - "Hot Coffee"
          - "Cold Coffee"
          - "Strawberry Shake"
          - "Butterscotch Shake"
          - "Chocolate Shake"
          - "Banana Shake"
          - "Oreo Shake"
          - "Sandwich + Small Fries + Coke"
          - "Burger + Small Fries + Coke"
          - "Small Garlic Bread + Mocktail"
      status:
        description: 'New stock status'
        required: true
        type: choice
        options:
          - Available
          - Sold out
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: caloyaa-stock
  cancel-in-progress: false
jobs:
  update-stock:
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    if: github.actor == 'Nikhl098' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate item and update availability
        env:
          ITEM: ${{ inputs.item }}
          STATUS: ${{ inputs.status }}
        run: |
          python3 - <<'PY'
          import json, os, datetime
          path='stock.json'
          with open(path, encoding='utf-8') as f: data=json.load(f)
          item=os.environ['ITEM'].strip()
          if item not in data['items']:
              raise SystemExit('Unknown menu item. Copy the exact name from the Caloyaa menu.')
          status=os.environ['STATUS']
          if status not in ('Available', 'Sold out'):
              raise SystemExit('Invalid stock status.')
          data['items'][item]=(status=='Available')
          data['updatedAt']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          with open(path,'w',encoding='utf-8') as f: json.dump(data,f,ensure_ascii=False,indent=2);f.write('\n')
          print(item+': '+status)
          PY
      - name: Commit stock status
        id: commit
        env:
          ITEM: ${{ inputs.item }}
          STATUS: ${{ inputs.status }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stock.json
          if git diff --cached --quiet; then
            echo 'No change needed'
          else
            git commit -m "Stock: ${ITEM} is ${STATUS}"
            git push origin HEAD:main
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  deploy:
    if: github.actor == 'Nikhl098' && github.ref == 'refs/heads/main'
    needs: update-stock
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-stock.outputs.commit_sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
